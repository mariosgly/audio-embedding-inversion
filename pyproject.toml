[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-embedding-inversion"
version = "0.1.0"
description = "Research code for training audio embedding-to-audio inversion models"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
  "alias-free-torch==0.0.6",
  "auraloss==0.4.0",
  "descript-audio-codec==1.0.0",
  "einops==0.8.2",
  "einops-exts==0.0.4",
  "ema-pytorch==0.2.3",
  "encodec==0.1.1",
  "huggingface-hub==1.7.1",
  "importlib-resources==5.12.0",
  "k-diffusion==0.1.1",
  "laion-clap==1.1.4",
  "local-attention==1.8.6",
  "numpy==2.2.6",
  "packaging==26.0",
  "pandas==2.2.3",
  "prefigure==0.0.9",
  "pytorch-lightning==2.5.5",
  "PyWavelets==1.8.0",
  "safetensors==0.7.0",
  "scipy==1.15.3",
  "sentencepiece==0.2.1",
  "soundfile==0.13.1",
  "torch==2.7.1",
  "torchaudio==2.7.1",
  "torchmetrics==1.8.2",
  "tqdm==4.67.3",
  "transformers==5.8.0",
  "v-diffusion-pytorch==0.0.2",
  "vector-quantize-pytorch==1.14.41",
  "wandb==0.19.11",
  "webdataset==0.2.100",
]

[project.optional-dependencies]
feature-extraction = [
  "audioset-convnext-inf",
]
dev = [
  "ruff==0.15.6",
]

[project.scripts]
audio-embedding-inversion-train = "train:main"
audio-embedding-extract-features = "feature_extraction.extract_features:main"

[project.urls]
Homepage = "https://github.com/mariosgly/audio-embedding-inversion"
Upstream = "https://github.com/Stability-AI/stable-audio-tools"

[tool.setuptools]
py-modules = ["train"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "stable_audio_tools*",
  "feature_extraction*",
]
exclude = [
  "jobs*",
  "docs*",
]

[tool.setuptools.package-data]
stable_audio_tools = ["configs/**/*.json"]
feature_extraction = ["encodec_fx/*.yml", "vggish/*.yml", "vggish/*.txt"]
